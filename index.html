<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Сборка щитка (Плавно и без следов)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  
  html, body { 
    height: 100%; 
    height: 100dvh; 
    overflow: hidden; 
    font-family: Arial, sans-serif; 
    background: #2c3e50;
  }

  #app { 
    display: flex; 
    flex-direction: column; 
    height: 100%; 
    height: 100dvh; 
    width: 100%;
  }

  /* ВЕРХНЕЕ МЕНЮ */
  #menu {
    display: flex;
    background: #2c3e50;
    padding: 8px;
    gap: 8px;
    overflow-x: auto;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    z-index: 10;
    padding-top: max(8px, env(safe-area-inset-top));
  }
  .menu-item {
    background: #fff;
    border-radius: 8px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    min-width: 65px;
    flex-shrink: 0;
  }
  .menu-item img { height: 55px; width: auto; pointer-events: none; }
  .menu-item span { font-size: 11px; font-weight: bold; color: #2c3e50; margin-top: 4px; }

  /* РАБОЧАЯ ОБЛАСТЬ */
  #workspace { 
    flex: 1; 
    position: relative; 
    overflow: hidden; 
    background-color: #e8e8e8; /* <--- СДЕЛАЛИ СЕРЫМ */
    touch-action: none; 
    width: 100%; 
  }

  #gridCanvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  #itemsLayer {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    transform-origin: 0 0;
    will-change: transform;
    z-index: 2;
    pointer-events: none;
  }

  .breaker {
    position: absolute;
    top: 0; left: 0;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: auto;
    z-index: 10;
    /* will-change ускоряет отрисовку на GPU */
    will-change: transform;
    /* Используем transform вместо left/top для плавности */
    transform: translate3d(0, 0, 0);
  }
  
  .breaker.dragging { z-index: 100; }
  
  /* Подсветка при пересечении */
  .breaker.collision {
    filter: drop-shadow(0 0 8px rgba(231, 76, 60, 0.9));
    opacity: 0.8;
  }
  .breaker.over-trash { opacity: 0.4; }
  
  .breaker img {
    display: block;
    pointer-events: none;
    -webkit-user-drag: none;
    width: 100%; height: 100%;
  }

  /* КОРЗИНА */
  #trash {
    position: absolute;
    bottom: max(24px, env(safe-area-inset-bottom));
    right: 24px;
    width: 70px;
    height: 70px;
    background: #e74c3c;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    box-shadow: 0 6px 16px rgba(0,0,0,0.4);
    z-index: 9999;
    transition: transform 0.15s, background 0.15s;
    border: 3px solid #fff;
  }
  #trash.active {
    transform: scale(1.2);
    background: #c0392b;
    box-shadow: 0 0 0 6px rgba(231,76,60,0.4);
  }

  #zoomInfo {
    position: absolute;
    top: 12px;
    right: 12px;
    background: rgba(44,62,80,0.9);
    color: #fff;
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: bold;
    z-index: 50;
    pointer-events: none;
  }

  #hint {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(44,62,80,0.9);
    color: #fff;
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 12px;
    white-space: nowrap;
    z-index: 50;
    transition: opacity 0.5s;
    pointer-events: none;
    text-align: center;
  }

  /* МОДАЛЬНОЕ ОКНО */
  #modalOverlay {
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10000;
  }
  #modalOverlay.show { display: flex; }
  
  #modalBox {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    width: 80%;
    max-width: 300px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  #modalBox h3 { margin-bottom: 15px; color: #2c3e50; font-size: 18px; }
  #modalInput {
    width: 100%;
    padding: 12px;
    font-size: 18px;
    border: 2px solid #ccc;
    border-radius: 8px;
    text-align: center;
    margin-bottom: 15px;
    outline: none;
  }
  #modalInput:focus { border-color: #3498db; }
  
  .modal-btns {
    display: flex;
    gap: 10px;
  }
  .modal-btns button {
    flex: 1;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-weight: bold;
  }
  #btnCancel { background: #e0e0e0; color: #333; }
  #btnSave { background: #2ecc71; color: #fff; }
  
  /* ЭКРАН СТАРТА (ГАЛЕРЕЯ) */
  #startScreen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #1a1a1a; z-index: 99999; display: flex; flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  .header { padding: 20px; text-align: center; }
  .header h2 { color: #3498db; font-size: 26px; margin: 0; }
  .content { flex: 1; padding: 0 20px; display: flex; flex-direction: column; align-items: center; overflow-y: auto; }
  .btn-new {
    background: #3498db; color: #fff; border: none; padding: 16px;
    font-size: 18px; font-weight: bold; border-radius: 12px; width: 100%; max-width: 400px;
    margin-bottom: 30px; cursor: pointer;
  }
  .btn-new:active { transform: scale(0.98); }
  .saved-title { color: #7f8c8d; font-size: 14px; width: 100%; max-width: 400px; text-align: left; margin-bottom: 15px; letter-spacing: 1px; }
  .projects-list { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 30px; }
  .project-item {
    background: #2a2a2a; border-radius: 12px; padding: 15px;
    display: flex; align-items: center; gap: 15px; border: 1px solid #3a3a3a;
  }
  .project-thumb {
    width: 60px; height: 60px; background: #e8e8e8; border-radius: 8px;
    flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 24px;
  }
  .project-info { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .project-date { color: #bdc3c7; font-size: 12px; }
  .project-actions { display: flex; gap: 10px; }
  .btn-open { background: #2ecc71; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }
  .btn-del { background: #e74c3c; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: bold; cursor: pointer; }

  /* КНОПКА СОХРАНЕНИЯ */
  #saveBtn {
    position: absolute; bottom: max(24px, env(safe-area-inset-bottom)); left: 24px;
    width: 60px; height: 60px; background: #3498db; color: #fff; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 9999; cursor: pointer;
  }
</style>
</head>
<body>

<!-- ЭКРАН СТАРТА (ГАЛЕРЕЯ) -->
<div id="startScreen">
  <div class="header">
    <h2>VoltMaster Project</h2>
  </div>
  
  <div class="content">
    <button class="btn-new" onclick="startNewProject()">Создать новый проект</button>
    
    <div class="saved-title">СОХРАНЕННЫЕ РАБОТЫ</div>
    <div id="projectsList" class="projects-list">
      <!-- Сюда будут добавляться сохранения -->
    </div>
  </div>
</div>

<div id="app">
  <div id="menu"></div>

  <div id="workspace">
    <canvas id="gridCanvas"></canvas>
    <div id="itemsLayer"></div>
    
    <div id="hint">Двойной тап — ввод номинала. Ставятся вплотную.</div>
    <div id="zoomInfo">100%</div>

    <div id="trash">🗑</div>
    <div id="saveBtn">💾</div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО -->
<div id="modalOverlay">
  <div id="modalBox">
    <h3>Введите номинал (А)</h3>
    <input type="number" id="modalInput" placeholder="Например: 16" min="1" max="9999">
    <div class="modal-btns">
      <button id="btnCancel">Отмена</button>
      <button id="btnSave">Сохранить</button>
    </div>
  </div>
</div>

<script>
// ==========================================
// ГЕНЕРАТОРЫ (БЕЗ ИЗМЕНЕНИЙ)
// ==========================================
function generateSVG(totalWidth, poles, amps = '') {
  const h = 130, padding = 2;
  const innerW = totalWidth - padding * 2;
  const poleW = innerW / poles;
  const text = amps ? (amps.length > 3 ? amps.substring(0,3) : amps) : '';

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${totalWidth}" height="${h}" viewBox="0 0 ${totalWidth} ${h}">`;
  svg += `<rect x="${padding}" y="5" width="${innerW}" height="${h-10}" fill="#fff" stroke="#bbb" stroke-width="1"/>`;
  svg += `<rect x="${padding}" y="5" width="${innerW}" height="25" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>`;
  for (let i = 1; i < poles; i++) {
    const x = padding + poleW * i;
    svg += `<line x1="${x}" y1="5" x2="${x}" y2="${h-5}" stroke="#ccc" stroke-width="1"/>`;
  }
  for (let i = 0; i < poles; i++) {
    const cx = padding + poleW * i + poleW / 2;
    svg += `<circle cx="${cx}" cy="17" r="6" fill="#888" stroke="#555" stroke-width="1"/>`;
    svg += `<circle cx="${cx}" cy="17" r="3" fill="#333"/>`;
    svg += `<circle cx="${cx}" cy="113" r="6" fill="#888" stroke="#555" stroke-width="1"/>`;
    svg += `<circle cx="${cx}" cy="113" r="3" fill="#333"/>`;
    svg += `<rect x="${cx - 5}" y="88" width="10" height="6" fill="#fff" stroke="#ccc" stroke-width="0.5"/>`;
    if (text) {
      svg += `<text x="${cx}" y="93" font-family="Arial" font-size="4" font-weight="bold" fill="#000" text-anchor="middle">${text}A</text>`;
    }
  }
  const leverY = 65, leverH = 20, leverTopY = 45, leverTopH = 20;
  if (poles === 1) {
    const cx = padding + poleW / 2;
    svg += `<rect x="${cx - 7}" y="${leverY}" width="14" height="${leverH}" fill="#2b6cb0" rx="1"/>`;
    svg += `<rect x="${cx - 5}" y="${leverTopY}" width="10" height="${leverTopH}" fill="#2b6cb0" rx="1"/>`;
    svg += `<text x="${cx}" y="59" font-family="Arial" font-size="4" font-weight="bold" fill="#fff" text-anchor="middle" transform="rotate(90 ${cx} 59)">OFF</text>`;
  } else {
    const totalLeverW = (poleW * poles) - 10;
    const startX = padding + 5;
    svg += `<rect x="${startX}" y="${leverY}" width="${totalLeverW}" height="${leverH}" fill="#2b6cb0" rx="2"/>`;
    svg += `<rect x="${startX + 2}" y="${leverTopY}" width="${totalLeverW - 4}" height="${leverTopH}" fill="#2b6cb0" rx="2"/>`;
    for (let i = 1; i < poles; i++) {
      const x = padding + poleW * i;
      svg += `<line x1="${x}" y1="${leverY}" x2="${x}" y2="${leverY + leverH}" stroke="#1e4e8c" stroke-width="1"/>`;
      svg += `<line x1="${x}" y1="${leverTopY}" x2="${x}" y2="${leverTopY + leverTopH}" stroke="#1e4e8c" stroke-width="1"/>`;
    }
    const centerX = padding + innerW / 2;
    svg += `<text x="${centerX}" y="59" font-family="Arial" font-size="5" font-weight="bold" fill="#fff" text-anchor="middle">OFF</text>`;
  }
  const cx1 = padding + poleW / 2;
  if (poleW > 15) {
    svg += `<text x="${cx1}" y="38" font-family="Arial" font-size="5" font-weight="bold" fill="#0066cc" text-anchor="middle">CHNT</text>`;
    svg += `<text x="${cx1}" y="44" font-family="Arial" font-size="3" fill="#666" text-anchor="middle">DZ47-60</text>`;
  }
  svg += `</svg>`;
  return svg;
}

// ==========================================
// ФУНКЦИЯ ОТРИСОВКИ ОТСЕКАТЕЛЯ (РЕЛЕ PH-263t)
// ==========================================

// ==========================================
// ОБНОВЛЕННАЯ ФУНКЦИЯ ОТРИСОВКИ БЛОКА IEK РБД-125А
// ==========================================
function generateTDMBlockSVG() {
  // Пропорции подобраны под реальный блок (он выше и уже, чем стандартный автомат)
  const w = 60, h = 130; 
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  
  // 1. Белое основание (крепление на DIN-рейку)
  // Верхнее ушко с прорезью
  svg += `<path d="M 20 5 L 40 5 L 45 15 L 45 25 L 15 25 L 15 15 Z" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>`;
  svg += `<rect x="25" y="5" width="10" height="8" rx="4" fill="#fff" stroke="#999" stroke-width="1"/>`; // прорезь
  // Основной корпус сзади
  svg += `<rect x="12" y="25" width="36" height="75" rx="2" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>`;
  // Нижнее крепление
  svg += `<path d="M 12 100 L 48 100 L 48 115 L 40 125 L 20 125 L 12 115 Z" fill="#f0f0f0" stroke="#ccc" stroke-width="1"/>`;
  svg += `<rect x="23" y="110" width="14" height="10" rx="5" fill="#fff" stroke="#999" stroke-width="1"/>`; // нижняя прорезь

  // 2. Синяя прозрачная крышка
  // Основной прямоугольник
  svg += `<rect x="15" y="25" width="30" height="75" rx="2" fill="#0077cc" opacity="0.85" stroke="#005599" stroke-width="1"/>`;
  
  // Блик на крышке (для эффекта прозрачного пластика)
  svg += `<path d="M 16 26 L 44 26 L 42 30 L 18 30 Z" fill="#ffffff" opacity="0.3"/>`;
  
  // Горизонтальные разделительные полосы на крышке
  svg += `<line x1="15" y1="60" x2="45" y2="60" stroke="#005599" stroke-width="1.5"/>`;
  svg += `<line x1="15" y1="80" x2="45" y2="80" stroke="#005599" stroke-width="1.5"/>`;

  // 3. Верхняя часть (Ввод)
  // Большой болт (в центре)
  svg += `<circle cx="24" cy="42" r="8" fill="#333" stroke="#666" stroke-width="1"/>`;
  svg += `<polygon points="24,36 27,42 24,48 21,42" fill="#888"/>`; // грань болта
  // Малый болт (справа)
  svg += `<circle cx="38" cy="40" r="4" fill="#333" stroke="#666" stroke-width="1"/>`;
  svg += `<polygon points="38,37 40,40 38,43 36,40" fill="#888"/>`;

  // 4. Нижняя часть (6 клемм)
  // Верхний ряд (3 болта)
  for (let i = 0; i < 3; i++) {
    const cx = 22 + i * 8;
    const cy = 70;
    svg += `<circle cx="${cx}" cy="${cy}" r="3.5" fill="#333" stroke="#666" stroke-width="1"/>`;
    svg += `<circle cx="${cx}" cy="${cy}" r="1.5" fill="#888"/>`; // внутренний шестигранник
  }
  // Нижний ряд (3 болта)
  for (let i = 0; i < 3; i++) {
    const cx = 22 + i * 8;
    const cy = 90;
    svg += `<circle cx="${cx}" cy="${cy}" r="3.5" fill="#333" stroke="#666" stroke-width="1"/>`;
    svg += `<circle cx="${cx}" cy="${cy}" r="1.5" fill="#888"/>`;
  }

  // 5. Тексты на крышке
  svg += `<text x="24" y="55" font-family="Arial" font-size="3" font-weight="bold" fill="#fff">IEK</text>`;
  svg += `<text x="24" y="58" font-family="Arial" font-size="2.5" fill="#fff">РБД-125А</text>`;
  
  svg += `</svg>`;
  return svg;
}

// ==========================================
// ФУНКЦИЯ ОТРИСОВКИ ШИНЫ (DIN-рейка)
// ==========================================
function generateBusbarSVG() {
  const w = 150, h = 60;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  
  // Серый корпус
  svg += `<rect x="5" y="5" width="140" height="50" rx="2" fill="#ddd" stroke="#999" stroke-width="1"/>`;
  
  // Синие полосы
  svg += `<rect x="10" y="10" width="130" height="10" fill="#0055aa" opacity="0.8"/>`;
  svg += `<rect x="10" y="25" width="130" height="10" fill="#0055aa" opacity="0.8"/>`;
  svg += `<rect x="10" y="40" width="130" height="10" fill="#0055aa" opacity="0.8"/>`;
  
  // Винты на синих полосах
  for(let i=0; i<12; i++) {
    const cx = 15 + i*11;
    svg += `<circle cx="${cx}" cy="15" r="3" fill="#ccc" stroke="#666" stroke-width="0.5"/>`;
    svg += `<line x1="${cx-2}" y1="15" x2="${cx+2}" y2="15" stroke="#666" stroke-width="0.5"/>`;
    
    svg += `<circle cx="${cx}" cy="30" r="3" fill="#ccc" stroke="#666" stroke-width="0.5"/>`;
    svg += `<line x1="${cx-2}" y1="30" x2="${cx+2}" y2="30" stroke="#666" stroke-width="0.5"/>`;
    
    svg += `<circle cx="${cx}" cy="45" r="3" fill="#ccc" stroke="#666" stroke-width="0.5"/>`;
    svg += `<line x1="${cx-2}" y1="45" x2="${cx+2}" y2="45" stroke="#666" stroke-width="0.5"/>`;
  }
  
  svg += `</svg>`;
  return svg;
}

// ==========================================
// ФУНКЦИЯ ОТРИСОВКИ КЛЕММНИКА (Синий проходной)
// ==========================================
function generateTerminalSVG() {
  const w = 20, h = 80;
  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  
  // Синий корпус
  svg += `<rect x="2" y="5" width="16" height="70" rx="2" fill="#0088cc" stroke="#005580" stroke-width="1"/>`;
  
  // Верхний винт
  svg += `<circle cx="10" cy="15" r="5" fill="#aaa" stroke="#555" stroke-width="1"/>`;
  svg += `<line x1="7" y1="15" x2="13" y2="15" stroke="#555" stroke-width="1"/>`;
  
  // Нижний винт
  svg += `<circle cx="10" cy="65" r="5" fill="#aaa" stroke="#555" stroke-width="1"/>`;
  svg += `<line x1="7" y1="65" x2="13" y2="65" stroke="#555" stroke-width="1"/>`;
  
  // Отверстия для проводов (сбоку)
  svg += `<rect x="15" y="10" width="5" height="10" fill="#333"/>`;
  svg += `<rect x="15" y="60" width="5" height="10" fill="#333"/>`;
  
  svg += `</svg>`;
  return svg;
}

function generateRelaySVG(amps = '') {
  const w = 52.5, h = 130;
  const padding = 2;
  const displayVal = amps ? amps : '220';

  let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">`;
  
  // Корпус
  svg += `<rect x="${padding}" y="5" width="${w-padding*2}" height="${h-10}" fill="#f0f0f0" stroke="#999" stroke-width="1"/>`;
  
  // Верхняя часть (клеммы L и N)
  svg += `<rect x="${padding}" y="5" width="${w-padding*2}" height="25" fill="#e8e8e8" stroke="#999" stroke-width="1"/>`;
  svg += `<text x="12" y="22" font-family="Arial" font-size="6" font-weight="bold" fill="#555">L</text>`;
  svg += `<text x="38" y="22" font-family="Arial" font-size="6" font-weight="bold" fill="#555">N</text>`;
  svg += `<path d="M 22 14 L 30 14 L 26 20 Z" fill="#666"/>`;
  svg += `<circle cx="12" cy="12" r="4" fill="#777" stroke="#444" stroke-width="1"/>`;
  svg += `<circle cx="38" cy="12" r="4" fill="#777" stroke="#444" stroke-width="1"/>`;

  // Синяя полоса и логотип
  svg += `<rect x="${padding}" y="32" width="${w-padding*2}" height="3" fill="#0066cc"/>`;
  svg += `<circle cx="9" cy="42" r="2.5" fill="#0066cc"/>`;
  svg += `<text x="16" y="44" font-family="Arial" font-size="5" font-weight="bold" fill="#333">PH-263t</text>`;

  // Дисплей
  svg += `<rect x="6" y="48" width="26" height="20" fill="#222" stroke="#555" stroke-width="1" rx="2"/>`;
  svg += `<text x="19" y="63" font-family="Courier, monospace" font-size="12" font-weight="bold" fill="#ff3333" text-anchor="middle" textLength="22" lengthAdjust="spacingAndGlyphs">${displayVal}</text>`;
  
  // Индикаторы
  svg += `<circle cx="40" cy="52" r="1.5" fill="#0c0"/>`;
  svg += `<text x="44" y="54" font-family="Arial" font-size="4" fill="#333">V</text>`;
  svg += `<circle cx="40" cy="58" r="1.5" fill="#0c0"/>`;
  svg += `<text x="44" y="60" font-family="Arial" font-size="4" fill="#333">A</text>`;
  svg += `<circle cx="40" cy="64" r="1.5" fill="#0c0"/>`;

// ==========================================
// ПРОВЕРКА ПЕРЕСЕЧЕНИЙ (С ЗАЗОРОМ 1px)
// ==========================================
function checkCollision(targetEl, x, y) {
  const w = parseFloat(targetEl.style.width) || 0;
  const h = parseFloat(targetEl.style.height) || 0;
  
  // Границы тестируемого автомата
  const r1 = { left: x, top: y, right: x + w, bottom: y + h };
  
  const allBreakers = itemsLayer.querySelectorAll('.breaker');
  for (let el of allBreakers) {
    if (el === targetEl) continue; 
    
    const ex = parseFloat(el.dataset.x) || 0;
    const ey = parseFloat(el.dataset.y) || 0;
    const ew = parseFloat(el.style.width) || 0;
    const eh = parseFloat(el.style.height) || 0;
    
    const r2 = { left: ex, top: ey, right: ex + ew, bottom: ey + eh };
    
    // ДОБАВЛЯЕМ ЗАЗОР: если они просто касаются (на границе), это не коллизия
    // Уменьшаем прямоугольники на 1 пиксель для проверки
    if (r1.left + 1 < r2.right && r1.right - 1 > r2.left &&
        r1.top + 1 < r2.bottom && r1.bottom - 1 > r2.top) {
      return true; 
    }
  }
  return false;
}

// ==========================================
// СЕТКА
// ==========================================
function resizeCanvas() {
  const rect = workspace.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  gridCanvas.width = rect.width * dpr;
  gridCanvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawGrid();
}

function drawGrid() {
  const rect = workspace.getBoundingClientRect();
  const w = rect.width; const h = rect.height;
  ctx.clearRect(0, 0, w, h);
  
  // Заливаем фон серым (чуть светлее, чем сам фон, чтобы сетка выделялась)
  ctx.fillStyle = '#e8e8e8'; // <--- Цвет фона
  ctx.fillRect(0, 0, w, h);
  
  const step = GRID_BASE * zoom;
  const offsetX = panX % step; const offsetY = panY % step;
  
  // Делаем линии сетки более контрастными (темно-серыми)
  ctx.strokeStyle = '#c0c0c0'; // <--- Цвет линий сетки
  ctx.lineWidth = 1;
  ctx.beginPath();
  
  for (let x = offsetX; x <= w; x += step) { ctx.moveTo(x, 0); ctx.lineTo(x, h); }
  for (let y = offsetY; y <= h; y += step) { ctx.moveTo(0, y); ctx.lineTo(w, y); }
  ctx.stroke();
}

function updateTransform() {
  itemsLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
  zoomInfo.textContent = `${Math.round(zoom * 100)}%`;
  drawGrid();
}

window.addEventListener('resize', resizeCanvas);
setTimeout(() => { resizeCanvas(); updateTransform(); }, 200);

// ==========================================
// ЗУМ
// ==========================================
let pinchStartDist = 0, pinchStartZoom = 1, pinchStartPanX = 0, pinchStartPanY = 0, pinchCenterX = 0, pinchCenterY = 0;

workspace.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    const t1 = e.touches[0], t2 = e.touches[1];
    pinchStartDist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    pinchStartZoom = zoom; pinchStartPanX = panX; pinchStartPanY = panY;
    const rect = workspace.getBoundingClientRect();
    pinchCenterX = (t1.clientX + t2.clientX) / 2 - rect.left;
    pinchCenterY = (t1.clientY + t2.clientY) / 2 - rect.top;
  }
}, { passive: false });

workspace.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const t1 = e.touches[0], t2 = e.touches[1];
    const dist = Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
    const ratio = dist / pinchStartDist;
    let newZoom = pinchStartZoom * ratio;
    newZoom = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, newZoom));
    const rect = workspace.getBoundingClientRect();
    const centerX = (t1.clientX + t2.clientX) / 2 - rect.left;
    const centerY = (t1.clientY + t2.clientY) / 2 - rect.top;
    const layerX = (pinchCenterX - pinchStartPanX) / pinchStartZoom;
    const layerY = (pinchCenterY - pinchStartPanY) / pinchStartZoom;
    zoom = newZoom;
    panX = centerX - layerX * zoom; panY = centerY - layerY * zoom;
    itemsLayer.style.transform = `translate(${panX}px, ${panY}px) scale(${zoom})`;
    drawGrid();
    zoomInfo.textContent = `${Math.round(zoom * 100)}%`;
  }
}, { passive: false });

// ==========================================
// ДОБАВЛЕНИЕ АВТОМАТА
// ==========================================
let zIndexCounter = 10;

function spawnBreaker(automata) {
  if (hint) { hint.style.opacity = '0'; setTimeout(() => hint.remove(), 600); }
  const wrap = document.createElement('div');
  wrap.className = 'breaker';
  let w, h, svg = '';
  
  // УСТАНАВЛИВАЕМ РАЗМЕРЫ
  if (automata.type === 'chnt') { w = 120; h = 160; } 
  else if (automata.type === 'relay') { w = 52.5; h = 195; }
  else if (automata.type === 'tdm') { w = 90; h = 195; }
  else if (automata.type === 'bus') { w = 150; h = 60; }
  else if (automata.type === 'terminal') { w = 20; h = 80; }
  else if (automata.type === 'rvf') { w = 26.25; h = 130; }
  else if (automata.type === 'rnpp') { w = 52.5; h = 130; }
  else { w = BASE_WIDTHS[automata.poles]; h = BASE_HEIGHT; }
  
  // 1. Получаем видимую область экрана
  const rect = workspace.getBoundingClientRect();
  const viewLeft = -panX / zoom;
  const viewTop = -panY / zoom;
  const viewWidth = rect.width / zoom;
  const viewHeight = rect.height / zoom;

  // 2. Начинаем с левого верхнего угла
  let spawnX = viewLeft;
  let spawnY = viewTop;
  let found = false;

  // Ищем в пределах экрана (с запасом вниз на 10 экранов, если всё занято)
  let maxSearchY = viewTop + (viewHeight * 10); 

  // Проходим по строкам (сверху вниз)
  for (let y = viewTop; y < maxSearchY && !found; y += GRID_BASE) {
    // Для каждой строки проходим слева направо
    for (let x = viewLeft; x < viewLeft + viewWidth; x += 5) { // Шаг 5 пикселей для точности
      
      // Если автомат не влезает в экран по ширине, пропускаем эту строку
      if (x + w > viewLeft + viewWidth) break;

      // Проверяем, свободно ли это место
      if (!checkCollision({style:{width:w+'px', height:h+'px'}, dataset:{}}, x, y)) {
        spawnX = x;
        spawnY = y;
        found = true;
        break;
      }
    }
    if (found) break;
  }

  // Округляем финальные координаты
  spawnX = Math.round(spawnX);
  spawnY = Math.round(spawnY);

  wrap.style.width = w + 'px'; wrap.style.height = h + 'px'; wrap.style.zIndex = ++zIndexCounter;
  wrap.dataset.type = automata.type || 'std'; wrap.dataset.poles = automata.poles || 0; wrap.dataset.amps = ''; 
  
  // РИСУЕМ КАРТИНКУ
  if (automata.type === 'chnt') { svg = generateCHNTSVG(''); } 
  else if (automata.type === 'relay') { svg = generateRelaySVG(''); }
  else if (automata.type === 'tdm') { svg = generateTDMBlockSVG(); }
  else if (automata.type === 'bus') { svg = generateBusbarSVG(); }
  else if (automata.type === 'terminal') { svg = generateTerminalSVG(); }
  else if (automata.type === 'rvf') { svg = generateRVFSVG(); }
  else if (automata.type === 'rnpp') { svg = generateRNPPSVG(); }
  else { svg = generateSVG(BASE_WIDTHS[automata.poles], automata.poles, ''); }
  
  const img = document.createElement('img');
  img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  wrap.appendChild(img);
  
  wrap.dataset.x = spawnX; wrap.dataset.y = spawnY;
  wrap.style.transform = `translate3d(${spawnX}px, ${spawnY}px, 0)`;
  
  itemsLayer.appendChild(wrap);
  makeDraggable(wrap);
}

  else { svg = generateSVG(BASE_WIDTHS[poles], poles, amps); }
  
  const img = el.querySelector('img');
  img.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
  el.dataset.amps = amps;
}

// ==========================================
// ПЕРЕТАСКИВАНИЕ (ПЛАВНОЕ)
// ==========================================
function makeDraggable(el) {
  let startX = 0, startY = 0, baseX = 0, baseY = 0;
  let dragging = false, isOverTrash = false, lastTap = 0, moved = false;
  let hasCollision = false;

  const onStart = (e) => {
    if (e.touches && e.touches.length > 1) return;
    if (e.target !== el && !el.contains(e.target)) return;
    e.preventDefault(); e.stopPropagation();
    moved = false;
    const now = Date.now();
    if (now - lastTap < 300) { openModal(el); lastTap = 0; return; }
    lastTap = now;
    dragging = true;
    el.classList.add('dragging'); el.style.zIndex = ++zIndexCounter;
    const point = e.touches ? e.touches[0] : e;
    startX = point.clientX; startY = point.clientY;
    baseX = parseFloat(el.dataset.x) || 0;
    baseY = parseFloat(el.dataset.y) || 0;
  };

  const onMove = (e) => {
    if (!dragging) return;
    if (e.touches && e.touches.length > 1) { onEnd(); return; }
    e.preventDefault(); e.stopPropagation();
    
    const point = e.touches ? e.touches[0] : e;
    const dx = (point.clientX - startX) / zoom;
    const dy = (point.clientY - startY) / zoom;
    if (Math.abs(dx) > 5 || Math.abs(dy) > 5) moved = true;

    // Двигаем без прилипания к сетке (плавно за пальцем)
    let newX = baseX + dx;
    let newY = baseY + dy;

    // Проверка на пересечение во время движения
    hasCollision = checkCollision(el, newX, newY);

    if (hasCollision) {
      el.classList.add('collision');
    } else {
      el.classList.remove('collision');
    }

    el.dataset.x = newX;
    el.dataset.y = newY;
    // ИСПОЛЬЗУЕМ TRANSFORM ДЛЯ ПЛАВНОСТИ
    el.style.transform = `translate3d(${newX}px, ${newY}px, 0)`;

    const trashRect = trash.getBoundingClientRect();
    const inTrash = point.clientX >= trashRect.left - 15 && point.clientX <= trashRect.right + 15 && point.clientY >= trashRect.top - 15 && point.clientY <= trashRect.bottom + 15;
    
    if (inTrash !== isOverTrash) {
      isOverTrash = inTrash;
      el.classList.toggle('over-trash', inTrash);
      trash.classList.toggle('active', inTrash);
    }
  };

  const onEnd = () => {
    if (!dragging) return;
    dragging = false;
    el.classList.remove('dragging');
    el.classList.remove('collision');
    trash.classList.remove('active');

    if (isOverTrash) { 
      el.remove(); 
    } else if (hasCollision) {
      // Если было пересечение — откат на исходную
      el.dataset.x = baseX;
      el.dataset.y = baseY;
      el.style.transform = `translate3d(${baseX}px, ${baseY}px, 0)`;
    } else {
      // Если всё ок — прилипаем к сетке ТОЛЬКО по вертикали (Y)
      // А по горизонтали (X) оставляем как есть, чтобы автоматы вставали ровно друг к другу
      let y = Math.round((parseFloat(el.dataset.y) || 0) / GRID_BASE) * GRID_BASE;
      let x = parseFloat(el.dataset.x) || 0; // X не округляем!
      
      el.dataset.x = x; el.dataset.y = y;
      el.style.transform = `translate3d(${x}px, ${y}px, 0)`;
    }
    isOverTrash = false;
    hasCollision = false;
    el.classList.remove('over-trash');
  };

  el.addEventListener('touchstart', onStart, { passive: false });
  el.addEventListener('touchmove', onMove, { passive: false });
  el.addEventListener('touchend', onEnd);
  el.addEventListener('touchcancel', onEnd);
  el.addEventListener('mousedown', onStart);
  window.addEventListener('mousemove', onMove);
  window.addEventListener('mouseup', onEnd);
}

// ==========================================
// МОДАЛКА
// ==========================================
function openModal(el) {
  currentEditingEl = el;
  modalInput.value = el.dataset.amps || '';
  modalOverlay.classList.add('show');
  modalInput.focus();
}

btnCancel.addEventListener('click', () => { modalOverlay.classList.remove('show'); currentEditingEl = null; });
btnSave.addEventListener('click', () => {
  if (currentEditingEl) { updateBreakerImage(currentEditingEl, modalInput.value.trim()); }
  modalOverlay.classList.remove('show'); currentEditingEl = null;
});
modalOverlay.addEventListener('click', (e) => { if (e.target === modalOverlay) { modalOverlay.classList.remove('show'); currentEditingEl = null; } });
modalInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') { btnSave.click(); } });

// ==========================================
// ГАЛЕРЕЯ И СОХРАНЕНИЕ ПРОЕКТОВ
// ==========================================
let currentProjectId = null; // ID текущего открытого проекта

function renderProjects() {
  const list = document.getElementById('projectsList');
  list.innerHTML = '';
  const projects = JSON.parse(localStorage.getItem('electroProjects') || '[]');
  
  if (projects.length === 0) {
    list.innerHTML = '<div style="color:#7f8c8d; text-align:center; margin-top:20px;">Нет сохраненных работ</div>';
    return;
  }

  projects.sort((a, b) => b.id - a.id); // Новые сверху

  projects.forEach(p => {
    const div = document.createElement('div');
    div.className = 'project-item';
    const d = new Date(p.id);
    const dateStr = `${d.toLocaleDateString()} ${d.toLocaleTimeString()}`;

    div.innerHTML = `
      <div class="project-thumb">⚡</div>
      <div class="project-info">
        <div class="project-date">${dateStr}</div>
        <div class="project-actions">
          <button class="btn-open" onclick="loadProject(${p.id})">Открыть</button>
          <button class="btn-del" onclick="deleteProject(${p.id})">Удалить</button>
        </div>
      </div>
    `;
    list.appendChild(div);
  });
}

function startNewProject() {
  currentProjectId = Date.now();
  document.getElementById('startScreen').style.display = 'none';
  itemsLayer.innerHTML = ''; // Очищаем поле
  
  const withGrid = confirm("Включить сетку на фоне?");
  if (!withGrid) {
    gridCanvas.style.display = 'none';
    workspace.style.backgroundColor = '#2a2a2a';
  } else {
    gridCanvas.style.display = 'block';
    workspace.style.backgroundColor = '#e8e8e8';
    resizeCanvas();
  }
}

document.getElementById('saveBtn').addEventListener('click', () => {
  const items = [];
  document.querySelectorAll('.breaker').forEach(el => {
    items.push({
      type: el.dataset.type,
      poles: el.dataset.poles,
      amps: el.dataset.amps,
      x: el.dataset.x,
      y: el.dataset.y
    });
  });
  
  let projects = JSON.parse(localStorage.getItem('electroProjects') || '[]');
  const existingIndex = projects.findIndex(p => p.id === currentProjectId);
  const projectData = { id: currentProjectId || Date.now(), items: items };

  if (existingIndex >= 0) {
    projects[existingIndex] = projectData;
  } else {
    projects.push(projectData);
  }

  localStorage.setItem('electroProjects', JSON.stringify(projects));
  alert('Проект успешно сохранен!');
});

function loadProject(id) {
  const projects = JSON.parse(localStorage.getItem('electroProjects') || '[]');
  const project = projects.find(p => p.id === id);
  if (!project) return;

  currentProjectId = id;
  document.getElementById('startScreen').style.display = 'none';
  itemsLayer.innerHTML = ''; 

  gridCanvas.style.display = 'block';
  workspace.style.backgroundColor = '#e8e8e8';
  resizeCanvas();

  project.items.forEach(item => {
    let config = AUTOMATA.find(a => (a.type || 'std') === item.type);
    if (!config) return;
    spawnBreaker(config);
    const lastEl = itemsLayer.lastElementChild;
    if (lastEl) {
      lastEl.dataset.x = item.x;
      lastEl.dataset.y = item.y;
      lastEl.style.transform = `translate3d(${item.x}px, ${item.y}px, 0)`;
      if (item.amps) {
        lastEl.dataset.amps = item.amps;
        updateBreakerImage(lastEl, item.amps);
      }
    }
  });
}

function deleteProject(id) {
  if (!confirm('Удалить эту работу?')) return;
  let projects = JSON.parse(localStorage.getItem('electroProjects') || '[]');
  projects = projects.filter(p => p.id !== id);
  localStorage.setItem('electroProjects', JSON.stringify(projects));
  renderProjects();
}

window.addEventListener('DOMContentLoaded', () => {
  renderProjects();
});

document.addEventListener('dblclick', (e) => e.preventDefault(), { passive: false });
</script>
